aid: yulife
name: Yulife
description: >-
  YuLife is a London-founded (2016) technology-driven insurtech and employee
  benefits platform offering group life insurance, group health insurance,
  income protection and a gamified wellbeing app. Employees complete everyday
  wellness activities to earn YuCoin rewards, with access to an EAP, telemedicine
  and wellbeing apps such as Meditopia. A certified B Corp, YuLife insures 400k+
  lives across the UK and US and sells to employers and brokers. It publishes no
  public developer API or portal; api.yulife.com is the internal app backend
  (issuer api.uk.yulife.com), and a Vanta Trust Center is at trust.yulife.com.
